services:
  worker:
    build: .
    image: ruyipack/mock-openruyi:local
    platform: linux/amd64
    # Mock's simple isolation mounts a chroot. No nested container daemon.
    cap_add: [SYS_ADMIN]
    environment:
      MOCK_CONFIG: /etc/mock/openruyi.cfg
      BUILD_TARGET: /etc/ruyipack-target.json
    init: true
    stop_grace_period: 10s
