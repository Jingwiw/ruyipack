# Target macros follow openRuyi .github/build/_config at 94fa4d323665d3057a7ee01c8bec47242f883df5.
# OBS release counters are not available locally; these are development builds.
config_opts['root'] = 'openruyi-x86_64'
config_opts['target_arch'] = 'x86_64'
config_opts['dist'] = 'or'
config_opts['releasever'] = 'creek'
config_opts['package_manager'] = 'dnf5'
config_opts['isolation'] = 'simple'
config_opts['use_bootstrap'] = False
config_opts['use_bootstrap_image'] = False
config_opts['use_buildroot_image'] = False
config_opts['pivot_root_chroot'] = False
config_opts['print_main_output'] = True
config_opts['rpmbuild_networking'] = False
config_opts['plugin_conf']['root_cache_enable'] = False
config_opts['plugin_conf']['ccache_enable'] = False
# Mock 6.5 queries RPM's removed pkgid tag. The engine records a validated NEVRA list.
config_opts['plugin_conf']['package_state_enable'] = False
config_opts['chroot_setup_cmd'] = 'install bash coreutils cpio diffutils findutils gawk gcc gcc-c++ gzip make patch rpm-build rpm-config-openruyi sed shadow tar util-linux which xz perl-rpm-packaging glibc-gconv-modules-extra mold'
config_opts['macros'].update({
    '%dist': '.or', '%_vendor': 'openruyi', '%ext_info': '.gz',
    '%gcc_version': '15', '%bcond_override_default_systemd': '1',
    '%_with_systemd': '1', '%ext_man': '.gz', '%__python': '/usr/bin/python3',
    '%bcond_override_default_acl_tests': '1',
    '%__systemd_sysusers': '/usr/bin/systemd-sysusers',
    '%autorelease': '1%{?dist}', '%autochangelog': '%{nil}',
    '%_sbindir': '%{_bindir}',
    '%_vendor_repo_url': 'https://repo.build.openruyi.cn/openruyi/$basearch/',
})
config_opts['dnf.conf'] = """
[main]
assumeyes=1
timeout=30
retries=1
keepcache=1
install_weak_deps=0
best=1
gpgcheck=0
reposdir=/dev/null

[openruyi]
name=openRuyi rolling
baseurl=https://repo.build.openruyi.cn/openruyi/$basearch/
enabled=1
"""
