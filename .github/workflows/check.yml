name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install gate tools
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/python" -m pip install reuse==6.2.0
          echo "$RUNNER_TEMP/reuse/bin" >> "$GITHUB_PATH"
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Check source
        run: ./scripts/check
      - name: Test source installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/ruyipack-install"
          ./scripts/smoke-test "$RUNNER_TEMP/ruyipack-install/bin/ruyipack"

  stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test on latest stable
        run: |
          rustc --version --verbose
          cargo test --locked -- --format terse

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build RuyiPack
        run: |
          rustup toolchain install
          cargo build --locked
      - name: Prepare pinned openRuyi environment
        run: docker build --platform linux/amd64 -f tests/native/Dockerfile -t ruyipack-native .
      - name: Compare native RPM facts
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --user 1000:1000 \
            --tmpfs /tmp:rw,mode=1777 --tmpfs /var/tmp:rw,mode=1777 \
            -v "$PWD:/work:ro" ruyipack-native \
            python3 /work/scripts/check-native-sources --ruyipack /work/target/debug/ruyipack
