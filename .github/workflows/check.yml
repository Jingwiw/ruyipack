name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Install gate tools
        run: |
          python3 -m venv "$RUNNER_TEMP/reuse"
          "$RUNNER_TEMP/reuse/bin/python" -m pip install reuse==6.2.0
          echo "$RUNNER_TEMP/reuse/bin" >> "$GITHUB_PATH"
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Check source
        run: ./scripts/check
      - name: Test source installation
        run: |
          cargo install --path . --locked --root "$RUNNER_TEMP/ruyipack-install"
          ./scripts/smoke-test "$RUNNER_TEMP/ruyipack-install/bin/ruyipack"

  stable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test on latest stable
        run: |
          rustc --version --verbose
          cargo test --locked
