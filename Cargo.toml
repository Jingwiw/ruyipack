[package]
name = "ruyipack"
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
license = "MulanPSL-2.0"
description = "Rust tooling for openRuyi RPM package workflows"
publish = false

[dependencies]
schemars = { version = "1.2.1", default-features = false, features = ["derive", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
minijinja = { version = "2.24.0", default-features = false, features = ["serde", "debug", "multi_template"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
shell-words = "1.1.1"
similar = { version = "3.2.0", default-features = false, features = ["std", "text"] }
spdx = { version = "0.13.5", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse", "display", "preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["local-offset"] }
url = "2.5.8"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
fs-err = { version = "3.3.1", default-features = false }

[dependencies.rpm-spec-analyzer]
version = "=0.1.3"
git = "https://github.com/openRuyi-Project/rpm-spec-tool"
rev = "fd0b2c07e499ac7625b26c3978ea9992a4b73996"
default-features = false

[dependencies.rpm-spec]
version = "=0.4.1"
git = "https://github.com/openRuyi-Project/rpm-spec"
rev = "c0497cdf1cde3d8edf3782c969b2dbae0c684bfe"
default-features = false
features = ["parser", "printer", "serde"]

[build-dependencies]
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
dead_code_pub_in_binary = "warn"

# Prevent avoidable allocations without imposing broad stylistic lint groups.
[lints.clippy]
assigning_clones = "warn"
format_collect = "warn"
format_push_string = "warn"
redundant_clone = "warn"
