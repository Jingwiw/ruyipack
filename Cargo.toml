[package]
name = "ruyipack"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MulanPSL-2.0"
description = "Rust tooling for openRuyi RPM package workflows"
publish = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
thiserror = "2.0.18"

[dependencies.rpm-spec-analyzer]
version = "=0.1.3"
git = "https://github.com/openRuyi-Project/rpm-spec-tool"
rev = "8d9ca43b13a2e25ec3177c3780d0f2636d5e1368"
default-features = false

[dependencies.rpm-spec]
version = "=0.4.1"
git = "https://github.com/openRuyi-Project/rpm-spec"
rev = "2d5139521c8bef5cf61cb9692d75fd0b5282ffd9"
default-features = false
features = ["parser", "printer"]

[build-dependencies]
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[lints.rust]
unsafe_code = "forbid"
