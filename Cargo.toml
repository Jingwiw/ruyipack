[package]
name = "ruyipack"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MulanPSL-2.0"
description = "Rust tooling for openRuyi RPM package workflows"
publish = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[dependencies.rpm-spec-analyzer]
version = "=0.1.3"
git = "https://github.com/openRuyi-Project/rpm-spec-tool"
rev = "005e10d4ab2d781d6a8561ddb2df7134390f7c9f"
default-features = false

[dependencies.rpm-spec]
version = "=0.4.1"
git = "https://github.com/openRuyi-Project/rpm-spec"
rev = "b8702b69970c8091aa0a0ea9971628e40ffdf51e"
default-features = false
features = ["parser", "printer"]

[build-dependencies]
toml = "0.8.23"

[lints.rust]
unsafe_code = "forbid"
