[package]
name = "ruyipack"
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
license = "MulanPSL-2.0"
description = "Rust tooling for openRuyi RPM package workflows"
publish = false

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
schemars = { version = "1.2.1", default-features = false, features = ["derive", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false }
askama = { version = "0.15.6", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
shell-words = "1.1.1"
similar = { version = "3.2.0", default-features = false, features = ["std", "text"] }
spdx = { version = "0.13.5", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse", "display", "preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["local-offset"] }
url = "2.5.8"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
fs-err = { version = "3.3.1", default-features = false }

[dependencies.rpm-spec-analyzer]
version = "=0.1.3"
git = "https://github.com/openRuyi-Project/rpm-spec-tool"
rev = "b4aef927655256bef12608af665711245abcc4c0"
default-features = false

[dependencies.rpm-spec]
version = "=0.4.1"
git = "https://github.com/openRuyi-Project/rpm-spec"
rev = "964da4de8713babad153044dc1a7f0f48b2ae707"
default-features = false
features = ["parser", "printer", "serde"]

[build-dependencies]
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
dead_code_pub_in_binary = "warn"

# Focused ownership, conversion and readability rules shared by local and CI gates.
[lints.clippy]
# Method restrictions are opt-in per module; CLI boundaries may own stdio.
disallowed_methods = "allow"
assigning_clones = "warn"
format_collect = "warn"
format_push_string = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
doc_markdown = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
items_after_statements = "warn"
wildcard_imports = "warn"
large_stack_arrays = "warn"
ref_option = "warn"
used_underscore_binding = "warn"
needless_continue = "warn"
