# Stage actions are copied from openRuyi's own cmake package file
# SPECS/cmake/macros.buildsystem.cmake at commit
# bc722d18574a5805aca1ab1a03bf1ce323489506, SHA-256
# 49ec12458057fffe481406fa4ddf6ee1c9373c3a682f2dac412d266602413c37.
# This profile does not prefill or enforce a common set of required tools.
# Declare the tools and libraries the package uses and verify the target environment.
name = "cmake"
build-requires = []

[[stages]]
name = "conf"
action = "%cmake"

[[stages]]
name = "build"
action = "%cmake_build"

[[stages]]
name = "install"
action = "%cmake_install"

[[stages]]
name = "check"
action = "%ctest"
