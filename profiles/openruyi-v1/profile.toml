# Packaging Specification revision: 9862c6a93a0068a30d5b29cad74d14a281ca2e66
spec-license = "MulanPSL-2.0"
copyright-holders = [
  "Institute of Software, Chinese Academy of Sciences (ISCAS)",
  "openRuyi Project Contributors",
]
release = "%autorelease"
changelog = "%autochangelog"
no-public-vcs-comment = "# VCS: No VCS link available"
# RemoteAsset marker with a sha256 digest, and the bare marker openRuyi accepts
# when no digest is recorded (about 40% of cmake/meson packages use the bare form).
remote-asset-prefix = "#!RemoteAsset:  sha256:"
remote-asset-bare = "#!RemoteAsset"
preamble-value-column = 16
