# Stage macros: Meson 1.10.2 data/macros.meson, installed by openRuyi's
# SPECS/meson/meson.spec at commit 9a29ae4b294e31ed053bf8023262dc86b713ab0c.
# This profile does not prefill or enforce a common set of required tools.
# Declare the tools and libraries the package uses and verify the target environment.
name = "meson"
build-requires = []

[[stages]]
name = "conf"
action = "%meson"

[[stages]]
name = "build"
action = "%meson_build"

[[stages]]
name = "install"
action = "%meson_install"

[[stages]]
name = "check"
action = "%meson_test"
